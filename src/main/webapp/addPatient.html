<html>
<head>
  <title>Patient Data App</title>
</head>
<body>
<div class="main">
  <h1>Search</h1>
  <form method="GET" action="/addpatient">
    <input type="text" name="BIRTHDATE" placeholder="Enter birth date"/>
    <input type="text" name="DEATHDATE" placeholder="Enter death date"/>
    <input type="text" name="SSN" placeholder="Enter SSN"/>
    <input type="text" name="DRIVERS" placeholder="Enter driver's license number"/>
    <input type="text" name="PASSPORT" placeholder="Enter passport number"/>
    <input type="text" name="PREFIX" placeholder="Enter name prefix (e.g., Mr, Dr)"/>
    <input type="text" name="FIRST" placeholder="Enter first name"/>
    <input type="text" name="LAST" placeholder="Enter last name"/>
    <input type="text" name="SUFFIX" placeholder="Enter name suffix (e.g., Jr, Sr)"/>
    <input type="text" name="MAIDEN" placeholder="Enter maiden name"/>
    <input type="text" name="MARITAL" placeholder="Enter marital status"/>
    <input type="text" name="RACE" placeholder="Enter race"/>
    <input type="text" name="ETHNICITY" placeholder="Enter ethnicity"/>
    <input type="text" name="GENDER" placeholder="Enter gender"/>
    <input type="text" name="BIRTHPLACE" placeholder="Enter birthplace"/>
    <input type="text" name="ADDRESS" placeholder="Enter address"/>
    <input type="text" name="CITY" placeholder="Enter city"/>
    <input type="text" name="STATE" placeholder="Enter state/province"/>
    <input type="text" name="ZIP" placeholder="Enter ZIP/postal code"/>
    <input type="submit" value="Add Patient"/>
  </form>
</div>
</body>
</html>
